name: V81 Site Analyzer

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Analiz edilecek site URL"
        required: true
        type: string
      max_depth:
        description: "Maksimum depth"
        required: false
        default: "4"
        type: string
      max_requests:
        description: "Maksimum request"
        required: false
        default: "32"
        type: string
      timeout_minutes:
        description: "Timeout dakika"
        required: false
        default: "15"
        type: string

jobs:
  v81:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compile check
        run: |
          python -m py_compile server.py v81_layer.py repo_analyzer.py

      - name: Run V81
        env:
          V81_URL: ${{ inputs.url }}
          V81_MAX_DEPTH: ${{ inputs.max_depth }}
          V81_MAX_REQUESTS: ${{ inputs.max_requests }}
          V81_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          mkdir -p artifacts
          python server.py "$V81_URL" 2>&1 | tee artifacts/v81.log || true
          cp v81_report.json artifacts/v81_report.json 2>/dev/null || true
          cp resolver_memory.json artifacts/resolver_memory.json 2>/dev/null || true

      - name: Upload V81 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-result
          path: artifacts/
          if-no-files-found: warn
