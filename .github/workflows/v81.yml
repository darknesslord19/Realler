name: V81 Site Analyzer

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Analiz edilecek HTTP/HTTPS site URL'si"
        required: true
        type: string
      max_depth:
        description: "Maksimum tarama derinliği"
        required: false
        default: "4"
        type: string
      max_requests:
        description: "Maksimum statik istek sayısı"
        required: false
        default: "32"
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V81_GITHUB: "1"
      V81_MAX_DEPTH: ${{ inputs.max_depth }}
      V81_MAX_REQUESTS: ${{ inputs.max_requests }}
      V81_LISTEN_SECONDS: "12"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-github.txt
          python -m playwright install --with-deps chromium

      - name: Verify V81 files
        run: |
          set -eux
          test -f server.py
          test -f v81_layer.py
          test -f repo_analyzer.py
          test -f manual_listener.py
          test -f github_runner.py
          test -f requirements-github.txt
          python -m py_compile server.py v81_layer.py repo_analyzer.py manual_listener.py github_runner.py

      - name: Run V81 analyzer
        run: |
          mkdir -p v81_output
          python github_runner.py "${{ inputs.url }}" --output v81_output | tee v81_output/console.log

      - name: Upload V81 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-report
          path: v81_output/
          if-no-files-found: warn
          retention-days: 14
